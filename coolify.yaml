# ─────────────────────────────────────────────────────────────────────────────
# Tallents RH — Configuração do Coolify
#
# Como usar:
#   1. No Coolify: New Resource → Application → GitHub → julioandolfo/tallents
#   2. Build Pack: Dockerfile
#   3. Copie as variáveis da seção "environment" abaixo para o painel do Coolify
#   4. Preencha os valores marcados com ← PREENCHER
#   5. Deploy!
#
# O entrypoint cuida automaticamente de:
#   ✅ Gerar APP_KEY se não informado
#   ✅ Aguardar o banco de dados
#   ✅ Rodar migrations
#   ✅ Rodar seeders na primeira instalação
#   ✅ Criar storage link
#   ✅ Gerar caches (config, route, view, event)
# ─────────────────────────────────────────────────────────────────────────────

version: "1"

environment:
  # ── Aplicação ──────────────────────────────────────────────────────────────
  APP_NAME: "Tallents RH"
  APP_ENV: production
  APP_KEY: ""                        # ← deixe vazio — gerado automaticamente no boot
  APP_DEBUG: "false"
  APP_URL: "https://rh.seudominio.com.br"    # ← PREENCHER com seu domínio
  APP_TIMEZONE: "America/Sao_Paulo"

  APP_LOCALE: pt_BR
  APP_FALLBACK_LOCALE: pt_BR
  APP_FAKER_LOCALE: pt_BR

  # ── Banco de Dados (MySQL) ─────────────────────────────────────────────────
  # Use o nome interno do serviço MySQL criado no Coolify
  DB_CONNECTION: mysql
  DB_HOST: "mysql"                   # ← nome do serviço MySQL no Coolify
  DB_PORT: "3306"
  DB_DATABASE: tallents_rh
  DB_USERNAME: tallents
  DB_PASSWORD: ""                    # ← PREENCHER — senha forte

  # ── Redis ─────────────────────────────────────────────────────────────────
  # Use o nome interno do serviço Redis criado no Coolify
  REDIS_HOST: "redis"                # ← nome do serviço Redis no Coolify
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ""                 # ← PREENCHER — senha forte
  REDIS_CLIENT: phpredis

  # ── Cache / Sessão / Filas ─────────────────────────────────────────────────
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  SESSION_LIFETIME: "120"
  SESSION_ENCRYPT: "true"
  QUEUE_CONNECTION: redis
  BROADCAST_CONNECTION: log

  # ── Logs ──────────────────────────────────────────────────────────────────
  LOG_CHANNEL: stack
  LOG_STACK: daily
  LOG_LEVEL: error

  # ── Email SMTP ────────────────────────────────────────────────────────────
  MAIL_MAILER: smtp
  MAIL_HOST: ""                      # ← PREENCHER — ex: smtp.gmail.com
  MAIL_PORT: "587"
  MAIL_USERNAME: ""                  # ← PREENCHER
  MAIL_PASSWORD: ""                  # ← PREENCHER
  MAIL_ENCRYPTION: tls
  MAIL_FROM_ADDRESS: "noreply@seudominio.com.br"  # ← PREENCHER
  MAIL_FROM_NAME: "Tallents RH"

  # ── Storage ───────────────────────────────────────────────────────────────
  FILESYSTEM_DISK: local

  # ── Push Notifications (opcional) ─────────────────────────────────────────
  ONESIGNAL_APP_ID: ""               # ← opcional
  ONESIGNAL_REST_API_KEY: ""         # ← opcional
  VAPID_PUBLIC_KEY: ""               # ← opcional
  VAPID_PRIVATE_KEY: ""              # ← opcional

  # ── Segurança ─────────────────────────────────────────────────────────────
  BCRYPT_ROUNDS: "12"
