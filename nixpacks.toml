# Coolify / Nixpacks — configuração de build alternativa ao Dockerfile
# O Coolify usa o Dockerfile por padrão se encontrar um na raiz.
# Este arquivo é mantido como referência caso queira usar Nixpacks.

[variables]
PHP_VERSION = "8.4"
NODE_VERSION = "22"

[phases.setup]
nixPkgs = ["php84", "php84Extensions.pdo_mysql", "php84Extensions.gd",
           "php84Extensions.mbstring", "php84Extensions.zip",
           "php84Extensions.intl", "php84Extensions.bcmath",
           "php84Extensions.opcache", "nodejs_22", "nodePackages.npm"]

[phases.install]
cmds = [
    "composer install --no-dev --optimize-autoloader --no-scripts",
    "npm ci --frozen-lockfile",
    "npm run build"
]

[phases.build]
cmds = [
    "php artisan config:cache",
    "php artisan route:cache",
    "php artisan view:cache",
    "php artisan event:cache"
]

[start]
cmd = "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8080"
