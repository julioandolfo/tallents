name: tallents-rh

# ─────────────────────────────────────────────────────────────────────────────
# Deploy no Coolify:
#   1. New Resource → Docker Compose
#   2. Aponte para github.com/julioandolfo/tallents (branch main)
#   3. Em "Domains", adicione seu domínio → Coolify injeta SERVICE_FQDN_APP
#   4. Clique em Deploy — tudo sobe automaticamente
#
# Nenhuma variável precisa ser configurada manualmente.
# APP_KEY é gerado no primeiro boot. Credenciais iniciais aparecem no log.
# ─────────────────────────────────────────────────────────────────────────────

x-app-env: &app-env
  # Variável mágica do Coolify: declara que o domínio configurado na UI deve
  # ser roteado pelo Traefik para a porta 80 deste serviço (app). Sem isso o
  # Traefik não cria rota e responde "404 page not found".
  SERVICE_FQDN_APP_80: ""
  APP_NAME: "Tallents Gestão"
  APP_ENV: production
  APP_DEBUG: "false"
  # Chave de criptografia estável. Pode (e idealmente deve) ser sobrescrita por
  # um valor secreto definido no Coolify (Environment Variables → APP_KEY).
  # Precisa ser fixa: gerar uma nova a cada deploy invalida sessões e dados
  # criptografados.
  APP_KEY: "${APP_KEY:-base64:+KxPHTr5lSmbNMcwXAKzI5nm8ru244KY3nqtfqGSJxs=}"
  APP_URL: "${SERVICE_FQDN_APP:-http://localhost}"
  APP_TIMEZONE: "America/Sao_Paulo"
  APP_LOCALE: pt_BR
  APP_FALLBACK_LOCALE: pt_BR
  BCRYPT_ROUNDS: "12"
  LOG_CHANNEL: stack
  LOG_STACK: daily
  LOG_LEVEL: error

  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_DATABASE: tallents_rh
  DB_USERNAME: tallents
  DB_PASSWORD: "${DB_PASSWORD:-T4ll3nts_DB_2024!}"

  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: "${REDIS_PASSWORD:-T4ll3nts_RD_2024!}"
  REDIS_CLIENT: phpredis

  CACHE_STORE: redis
  SESSION_DRIVER: redis
  SESSION_LIFETIME: "120"
  SESSION_ENCRYPT: "true"
  QUEUE_CONNECTION: redis
  BROADCAST_CONNECTION: log
  FILESYSTEM_DISK: local

  MAIL_MAILER: "${MAIL_MAILER:-log}"
  MAIL_HOST: "${MAIL_HOST:-}"
  MAIL_PORT: "${MAIL_PORT:-587}"
  MAIL_USERNAME: "${MAIL_USERNAME:-}"
  MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
  MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-noreply@tallents.com.br}"
  MAIL_FROM_NAME: "Tallents Gestão"

services:
  # ─── Aplicação Laravel ───────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *app-env
    volumes:
      - storage_uploads:/var/www/html/storage/app/public
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "coolify.managed=true"

  # ─── MySQL 8.4 ───────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: tallents_rh
      MYSQL_USER: tallents
      MYSQL_PASSWORD: "${DB_PASSWORD:-T4ll3nts_DB_2024!}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-T4ll3nts_ROOT_2024!}"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "tallents", "-p${DB_PASSWORD:-T4ll3nts_DB_2024!}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # ─── Redis 7 ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-T4ll3nts_RD_2024!}
      --save 60 1
      --loglevel warning
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-T4ll3nts_RD_2024!}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mysql_data:
  redis_data:
  storage_uploads:
